<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎤 Resume Interview Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1000px;
            width: 100%;
            overflow: hidden;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1em;
            opacity: 0.9;
            font-weight: 300;
        }

        .content {
            padding: 40px;
            min-height: 500px;
        }

        /* Upload Section */
        .upload-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            text-align: center;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 50px 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            background: #f8f9ff;
        }

        .upload-area:hover {
            background: #f0f4ff;
            border-color: #764ba2;
        }

        .upload-area input {
            display: none;
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 15px;
        }

        .upload-text h3 {
            color: #333;
            margin-bottom: 8px;
            font-size: 1.3em;
        }

        .upload-text p {
            color: #666;
            font-size: 0.95em;
        }

        .file-info {
            color: #667eea;
            font-weight: 600;
            margin-top: 10px;
        }

        /* Buttons */
        .btn {
            padding: 14px 40px;
            border: none;
            border-radius: 10px;
            font-size: 1.05em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-width: 200px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            margin-right: 10px;
        }

        .btn-secondary:hover {
            background: #667eea;
            color: white;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Sections */
        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Progress Bar */
        .progress-bar {
            background: #e0e0e0;
            height: 10px;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            height: 100%;
            transition: width 0.5s ease;
        }

        /* Question Box */
        .question-box {
            background: linear-gradient(135deg, #f8f9ff 0%, #f0f4ff 100%);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            border-left: 5px solid #667eea;
        }

        .question-number {
            color: #667eea;
            font-weight: 700;
            font-size: 0.95em;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .question-text {
            font-size: 1.3em;
            color: #333;
            line-height: 1.7;
            font-weight: 500;
        }

        /* Answer Input */
        .answer-input {
            width: 100%;
            min-height: 140px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-family: inherit;
            font-size: 1em;
            resize: vertical;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .answer-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* Button Group */
        .button-group {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        /* Status Message */
        .status {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 12px;
            font-weight: 500;
        }

        .status.show {
            display: flex;
        }

        .status.loading {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status.success {
            background: #e8f5e9;
            color: #388e3c;
        }

        .status.error {
            background: #ffebee;
            color: #d32f2f;
        }

        .spinner {
            border: 3px solid rgba(25, 118, 210, 0.2);
            border-top-color: #1976d2;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Evaluation Box */
        .evaluation-box {
            background: #f0f4ff;
            border: 2px solid #667eea;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            line-height: 1.8;
        }

        .score-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 1.1em;
            margin-bottom: 15px;
        }

        /* Summary Section */
        .summary-box {
            background: #f8f9ff;
            padding: 25px;
            border-radius: 15px;
            border-left: 5px solid #667eea;
            margin-bottom: 20px;
            white-space: pre-wrap;
            color: #333;
            font-size: 0.95em;
            line-height: 1.8;
        }

        .score-overview {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        .score-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .score-card .value {
            font-size: 2.5em;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .content {
                padding: 25px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .score-overview {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎤 Resume Interview Chatbot</h1>
            <p>Practice interviews with AI-powered feedback</p>
        </div>

        <div class="content">
            <!-- Upload Section -->
            <div class="section active" id="uploadSection">
                <div class="upload-section">
                    <div class="upload-area" onclick="document.getElementById('resumeFile').click()">
                        <input type="file" id="resumeFile" accept=".pdf,.txt" />
                        <div class="upload-icon">📄</div>
                        <div class="upload-text">
                            <h3>Upload Your Resume</h3>
                            <p>Drag and drop or click to select</p>
                            <p style="font-size: 0.85em; margin-top: 8px; color: #999;">PDF or TXT format</p>
                        </div>
                        <div class="file-info" id="fileInfo"></div>
                    </div>
                    <button class="btn btn-primary" onclick="uploadResume()">Start Interview</button>
                </div>
            </div>

            <!-- Interview Section -->
            <div class="section" id="interviewSection">
                <div class="status" id="status"></div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="question-box">
                    <div class="question-number" id="questionNumber"></div>
                    <div class="question-text" id="questionText"></div>
                </div>
                <textarea class="answer-input" id="answerInput" placeholder="Type your detailed answer here...\"></textarea>
                <div class="button-group">
                    <button class="btn btn-secondary" onclick="previousQuestion()">← Previous</button>
                    <button class="btn btn-primary" onclick="submitAnswer()">Submit Answer →</button>
                </div>
                <div id="evaluationDisplay"></div>
            </div>

            <!-- Summary Section -->
            <div class="section" id="summarySection">
                <h2 style="color: #667eea; margin-bottom: 20px;">📊 Interview Summary</h2>
                <div class="score-overview">
                    <div class="score-card">
                        <div>Average Score</div>
                        <div class="value" id="avgScore">0</div>
                        <div>/10</div>
                    </div>
                    <div class="score-card">
                        <div>Questions Completed</div>
                        <div class="value" id="completedCount">0</div>
                    </div>
                </div>
                <div class="summary-box" id="summaryContent"></div>
                <button class="btn btn-primary" onclick="location.reload()" style="width: 100%; margin-top: 20px;">🔄 Start New Interview</button>
            </div>
        </div>
    </div>

    <script>
        let state = {
            sessionId: null,
            currentQuestionIdx: 0,
            questions: [],
            answers: [],
            scores: []
        };

        document.getElementById('resumeFile').addEventListener('change', function(e) {
            if (e.target.files[0]) {
                document.getElementById('fileInfo').textContent = '✓ ' + e.target.files[0].name;
            }
        });

        async function uploadResume() {
            const fileInput = document.getElementById('resumeFile');
            if (!fileInput.files.length) {
                showStatus('error', '❌ Please select a resume file');
                return;
            }

            const formData = new FormData();
            formData.append('resume', fileInput.files[0]);

            showStatus('loading', 'Uploading and analyzing resume...');

            try {
                const response = await fetch('/api/upload-resume', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error);

                state.sessionId = data.session_id;

                showStatus('loading', 'Generating interview questions...');

                const qResponse = await fetch('/api/generate-questions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: state.sessionId,
                        num_questions: 5
                    })
                });

                const qData = await qResponse.json();
                if (!qResponse.ok) throw new Error(qData.error);

                state.questions = qData.questions;
                state.currentQuestionIdx = 0;

                showStatus('success', '✅ ' + qData.message);
                setTimeout(() => {
                    document.getElementById('uploadSection').classList.remove('active');
                    document.getElementById('interviewSection').classList.add('active');
                    loadQuestion();
                    hideStatus();
                }, 1000);
            } catch (error) {
                showStatus('error', '❌ Error: ' + error.message);
            }
        }

        function loadQuestion() {
            if (state.currentQuestionIdx < state.questions.length) {
                const q = state.questions[state.currentQuestionIdx];
                document.getElementById('questionNumber').textContent = `Question ${state.currentQuestionIdx + 1} of ${state.questions.length}`;
                document.getElementById('questionText').textContent = q;
                document.getElementById('answerInput').value = '';
                document.getElementById('evaluationDisplay').innerHTML = '';

                const progress = ((state.currentQuestionIdx + 1) / state.questions.length) * 100;
                document.getElementById('progressFill').style.width = progress + '%';
                document.getElementById('answerInput').focus();
            }
        }

        async function submitAnswer() {
            const answer = document.getElementById('answerInput').value.trim();
            if (!answer) {
                showStatus('error', '❌ Please provide an answer');
                return;
            }

            showStatus('loading', 'Evaluating your answer...');

            try {
                const response = await fetch('/api/submit-answer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        session_id: state.sessionId,
                        answer: answer
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error);

                state.answers.push(answer);
                state.scores.push(data.score);

                const evalHTML = `
                    <div class="evaluation-box">
                        <div class="score-badge">Score: ${data.score}/10</div>
                        <div><strong>Feedback:</strong><br>${data.feedback}</div>
                    </div>
                `;
                document.getElementById('evaluationDisplay').innerHTML = evalHTML;

                state.currentQuestionIdx++;

                if (data.questions_remaining > 0) {
                    showStatus('success', `✅ Great! ${data.questions_remaining} question(s) remaining.`);
                    setTimeout(() => {
                        loadQuestion();
                        hideStatus();
                    }, 2000);
                } else {
                    showStatus('success', '✅ Generating summary...');
                    setTimeout(() => endInterview(), 2000);
                }
            } catch (error) {
                showStatus('error', '❌ Error: ' + error.message);
            }
        }

        function previousQuestion() {
            if (state.currentQuestionIdx > 0) {
                state.currentQuestionIdx--;
                state.answers.pop();
                state.scores.pop();
                loadQuestion();
            }
        }

        async function endInterview() {
            showStatus('loading', 'Generating summary...');

            try {
                const response = await fetch('/api/end-interview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: state.sessionId })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error);

                document.getElementById('avgScore').textContent = data.average_score;
                document.getElementById('completedCount').textContent = data.completed_questions;
                document.getElementById('summaryContent').textContent = data.summary;

                document.getElementById('interviewSection').classList.remove('active');
                document.getElementById('summarySection').classList.add('active');
                hideStatus();
            } catch (error) {
                showStatus('error', '❌ Error: ' + error.message);
            }
        }

        function showStatus(type, msg) {
            const status = document.getElementById('status');
            status.className = `status show ${type}`;
            if (type === 'loading') {
                status.innerHTML = `<div class="spinner"></div> <span>${msg}</span>`;
            } else {
                status.textContent = msg;
            }
        }

        function hideStatus() {
            document.getElementById('status').classList.remove('show');
        }
    </script>
</body>
</html>
